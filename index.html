<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WolfConfigs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --card-bg: rgba(10, 15, 10, 0.75);
            --card-border: rgba(118, 230, 0, 0.15);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --brand-primary: #76e600;
            --brand-glow: rgba(118, 230, 0, 0.25);
            --btn-dark: #12161a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)),
                        url('./hero.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px var(--brand-glow);
            animation: fadeIn 0.8s ease-out;
        }

        .logo-container {
            margin-bottom: 1rem;
        }

        .logo {
            width: 100%;
            max-width: 220px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 8px var(--brand-glow));
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .links-flex {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0.9rem;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-discord {
            background-color: var(--brand-primary);
            color: #000000;
            border: 1px solid transparent;
            box-shadow: 0 4px 12px rgba(118, 230, 0, 0.2);
        }

        .btn-discord:hover {
            transform: translateY(-2px);
            background-color: #8eff1e;
            box-shadow: 0 0 25px var(--brand-primary);
        }

        .btn-secondary {
            background-color: var(--btn-dark);
            color: var(--text-primary);
            border: 1px solid rgba(118, 230, 0, 0.3);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            border-color: var(--brand-primary);
            box-shadow: 0 0 15px rgba(118, 230, 0, 0.2);
            background-color: #161b22;
        }

        .counter-container {
            margin-top: 20px;
        }

        .counter-container img {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            height: auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="./logo.png" alt="WolfConfigs Logo" class="logo">
        </div>

        <h1>Wolf Configs</h1>
        <p>Maximize your performance. Find optimized configurations, toolkits, and community links right here.</p>

        <div class="links-flex">
            <a href="https://discord.gg/sX2qd3cbST" class="btn btn-discord" target="_blank">
                💬 Join the Discord
            </a>

            <a href="Discord.html" class="btn btn-secondary">
                💬 Discord Informationen
            </a>

            <a href="https://github.com/b00nji" class="btn btn-secondary" target="_blank">
                💻 My GitHub Profil
            </a>

            <a href="https://github.com/WolfConfigs/RTCWConfigs" class="btn btn-secondary" target="_blank">
                ⚙️ RTCW Configs
            </a>

            <a href="https://github.com/WolfConfigs/ETProConfigs" class="btn btn-secondary" target="_blank">
                ⚙️ ETpro Configs
            </a>

            <a href="https://github.com/WolfConfigs/ETLegacyConfigs" class="btn btn-secondary" target="_blank">
                ⚙️ ETLegacy Configs
            </a>

            <a href="https://github.com/WolfConfigs/Server-Browsers" class="btn btn-secondary" target="_blank">
                🌐 Server Browsers
            </a>
        </div>

        <div class="counter-container">
            <a href="https://info.flagcounter.com/v17t">
                <img src="https://s01.flagcounter.com/count2/v17t/bg_0A0F0A/txt_76e600/border_0/columns_3/maxflags_12/viewers_0/labels_0/pageviews_1/flags_0/percent_0/" alt="Flag Counter" border="0">
            </a>
        </div>
    </div>
</body>
</html>
