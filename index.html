<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WolfConfigs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Hintergrund-Farbe der Glaskarte (Dunkles Anthrazit passend zum Logo) */
            --card-bg: rgba(10, 15, 10, 0.75);
            --card-border: rgba(118, 230, 0, 0.15);
            
            /* Textfarben */
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;

            /* 🎨 EXAKTE WOLFCONFIGS BRAND-FARBEN */
            --brand-primary: #76e600;   /* Das giftige Cyber-Grün aus deinem Logo */
            --brand-glow: rgba(118, 230, 0, 0.25); /* Perfekt abgestimmtes Leuchten */
            
            /* Social-Media-Farben */
            --discord-color: #5865F2;
            --github-color: #1e293b;
        }

        /* Body mit deinem hochgeladenen Hintergrundbild */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)), 
                        url('./hero.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Glaskarten-Container mit grünem Cyber-Leuchten */
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px var(--brand-glow);
            animation: fadeIn 0.8s ease-out;
        }

        /* 👁️ LOGO STYLE */
        .logo-container {
            margin-bottom: 1rem;
        }

        .logo {
            width: 100%;
            max-width: 220px;     /* Optimale Breite für dein breites Logo */
            height: auto;
            object-fit: contain;
            /* Subtiler grüner Schein hinter dem Logo */
            filter: drop-shadow(0 0 8px var(--brand-glow)); 
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .links-flex {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0.9rem;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-github {
            background-color: var(--github-color);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .btn-github:hover {
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
        }

        .btn-discord {
            background-color: var(--discord-color);
        }
        
        .btn-discord:hover {
            box-shadow: 0 5px 15px rgba(88, 101, 242, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dein neues WolfConfigs Logo -->
        <div class="logo-container">
            <img src="./logo.png" alt="WolfConfigs Logo" class="logo">
        </div>

        <h1>WolfConfigs</h1>
        <p>Willkommen! Hier findest du alle wichtigen Links zu meinen Konfigurationen, Projekten und der Community.</p>
        
        <div class="links-flex">
            <!-- Setze hier einfach deine Links anstelle des # ein -->
            <a href="#" class="btn btn-github" target="_blank">
                💻 GitHub Repository
            </a>
            <a href="#" class="btn btn-discord" target="_blank">
                💬 Discord Server
            </a>
        </div>
    </div>

</body>
</html>
