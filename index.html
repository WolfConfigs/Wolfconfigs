.jpg<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Links</title>
    <style>
        /* Modernes CSS Reset & Variablen */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --card-bg: rgba(15, 23, 42, 0.6); /* Dunkleres Glas für bessere Lesbarkeit auf Bildern */
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --discord-color: #5865F2;
            --github-color: #24292f;
            --github-hover: #333942;
        }

        /* Body mit Hintergrundbild */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Hintergrundbild über Unsplash (kannst du gegen jede URL austauschen) */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.6)), 
                        url('hero.jpg) no-repeat center center fixed;
            background-size: cover;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Glaskarten-Container */
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        /* Überschrift & Text */
        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        p {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        /* Button-Gruppe */
        .links-flex {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Basis-Button-Design */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0.9rem;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        /* Spezifische Button-Farben */
        .btn-github {
            background-color: var(--github-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-discord {
            background-color: var(--discord-color);
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Willkommen</h1>
        <p>Hier findest du alle wichtigen Links zu meinen Projekten und meiner Community.</p>
        
        <div class="links-flex">
            <!-- Ersetze die # Links unten mit deinen echten URLs -->
            <a href="https://github.com/WolfConfigs" class="btn btn-github" target="_blank">
                💻 Mein GitHub Repository
            </a>
            <a href="https://discord.gg/sX2qd3cbST" class="btn btn-discord" target="_blank">
                💬 Mein Discord Server
            </a>
        </div>
    </div>

</body>
</html>
